version: alpha
name: Next GM Broadcast Command Center
description: A premium dark wrestling management interface built from sharp broadcast panels, tactical glass, brand-lit accents, and viewport-first game shell composition.
colors:
  primary: "#D71920"
  on-primary: "#F2F4F7"
  primary-container: "#8B0000"
  on-primary-container: "#FFB3B3"
  secondary: "#005BFF"
  on-secondary: "#F2F4F7"
  secondary-container: "#003A99"
  on-secondary-container: "#58A6FF"
  tertiary: "#C9A227"
  on-tertiary: "#030407"
  tertiary-container: "#111111"
  on-tertiary-container: "#F8E7A1"
  background: "#030407"
  on-background: "#F2F4F7"
  surface: "#0A0D14"
  surface-dim: "#030509"
  surface-bright: "#111622"
  surface-container-lowest: "#030407"
  surface-container-low: "#080B12"
  surface-container: "#0A0D14"
  surface-container-high: "#111622"
  surface-container-highest: "#171D2B"
  on-surface: "#F2F4F7"
  on-surface-variant: "#B0BAC8"
  outline: "#303846"
  outline-variant: "#1D2430"
  inverse-surface: "#F2F4F7"
  inverse-on-surface: "#0A0D14"
  surface-tint: "#D71920"
  error: "#E5484D"
  on-error: "#030407"
  error-container: "#401014"
  on-error-container: "#FFC5CA"
  warning: "#F5B942"
  on-warning: "#030407"
  warning-container: "#3A2A08"
  on-warning-container: "#FFE3A1"
  success: "#35C46A"
  on-success: "#030407"
  success-container: "#0B341E"
  on-success-container: "#C5F2D0"
  info: "#4DB4FF"
  on-info: "#030407"
  info-container: "#062B45"
  on-info-container: "#B8DCFF"
  brand-red-primary: "#D71920"
  brand-red-secondary: "#8B0000"
  brand-red-accent: "#FFB3B3"
  brand-blue-primary: "#005BFF"
  brand-blue-secondary: "#003A99"
  brand-blue-accent: "#58A6FF"
  brand-gold-primary: "#F5C518"
  brand-gold-secondary: "#111827"
  brand-gold-accent: "#FFFFFF"
  brand-fight-gold-primary: "#C9A227"
  brand-fight-gold-secondary: "#111111"
  brand-fight-gold-accent: "#F8E7A1"
typography:
  display-xxl:
    fontFamily: Impact, Haettenschweiler, Arial Narrow, Franklin Gothic Heavy, Segoe UI Condensed, system-ui, sans-serif
    fontSize: 120px
    fontWeight: 950
    lineHeight: 0.82
    letterSpacing: 0.045em
  display-xl:
    fontFamily: Impact, Haettenschweiler, Arial Narrow, Franklin Gothic Heavy, Segoe UI Condensed, system-ui, sans-serif
    fontSize: 56px
    fontWeight: 950
    lineHeight: 0.92
    letterSpacing: 0.035em
  headline-lg:
    fontFamily: Impact, Haettenschweiler, Arial Narrow, Franklin Gothic Heavy, Segoe UI Condensed, system-ui, sans-serif
    fontSize: 32px
    fontWeight: 950
    lineHeight: 1
    letterSpacing: 0.025em
  headline-md:
    fontFamily: Impact, Haettenschweiler, Arial Narrow, Franklin Gothic Heavy, Segoe UI Condensed, system-ui, sans-serif
    fontSize: 20px
    fontWeight: 950
    lineHeight: 1.06
    letterSpacing: 0.025em
  body-md:
    fontFamily: Trebuchet MS, Segoe UI, ui-sans-serif, system-ui, sans-serif
    fontSize: 16px
    fontWeight: 700
    lineHeight: 1.34
    letterSpacing: 0em
  body-sm:
    fontFamily: Trebuchet MS, Segoe UI, ui-sans-serif, system-ui, sans-serif
    fontSize: 13px
    fontWeight: 700
    lineHeight: 1.34
    letterSpacing: 0em
  label-md:
    fontFamily: Cascadia Mono, SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace
    fontSize: 12px
    fontWeight: 950
    lineHeight: 1
    letterSpacing: 0.04em
  label-sm:
    fontFamily: Cascadia Mono, SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace
    fontSize: 11px
    fontWeight: 950
    lineHeight: 1
    letterSpacing: 0.05em
  data-md:
    fontFamily: Cascadia Mono, SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace
    fontSize: 14px
    fontWeight: 900
    lineHeight: 1.15
    letterSpacing: 0.02em
  ticker-sm:
    fontFamily: Bahnschrift, Arial Narrow, Segoe UI Condensed, Trebuchet MS, system-ui, sans-serif
    fontSize: 12px
    fontWeight: 900
    lineHeight: 1.08
    letterSpacing: 0.04em
rounded:
  none: 0px
  control: 2px
  panel: 3px
  dock: 8px
  poster: 3px
  full: 9999px
radii:
  none: 0px
  control: 2px
  panel: 3px
  dock: 8px
  poster: 3px
  full: 9999px
spacing:
  zero: 0px
  hairline: 1px
  micro: 2px
  xxs: 4px
  xs: 6px
  sm: 8px
  md: 10px
  lg: 12px
  xl: 16px
  xxl: 18px
  section-gap: 10px
  panel-padding: 12px
  hero-padding: 16px
  dock-padding: 6px
  safe-bottom: 86px
  hud-height: 60px
  dock-height: 56px
  viewport-margin: 12px
elevation:
  flat:
    shadow: none
    blur: 0px
  panel:
    shadow: 0 18px 46px rgba(0, 0, 0, 0.68)
    blur: 12px
  dock:
    shadow: 0 18px 46px rgba(0, 0, 0, 0.68), 0 0 22px rgba(215, 25, 32, 0.22)
    blur: 18px
  spotlight:
    shadow: 0 18px 58px rgba(0, 0, 0, 0.92), 0 0 18px rgba(215, 25, 32, 0.22)
    blur: 14px
shadows:
  none: none
  panel: 0 18px 46px rgba(0, 0, 0, 0.68)
  panel-inner: inset 0 1px 0 rgba(255, 255, 255, 0.12), inset 0 -1px 0 rgba(255, 255, 255, 0.04)
  brand-glow-red: 0 0 22px rgba(215, 25, 32, 0.22)
  brand-glow-blue: 0 0 22px rgba(0, 91, 255, 0.23)
  brand-glow-gold: 0 0 22px rgba(245, 197, 24, 0.22)
  hero-title: 0 0 18px rgba(215, 25, 32, 0.22), 0 18px 58px rgba(0, 0, 0, 0.92)
motion:
  duration-instant: 0ms
  duration-fast: 150ms
  duration-normal: 170ms
  duration-overlay: 160ms
  duration-collapse-delay: 180ms
  easing-standard: ease
  easing-enter: ease
  easing-exit: ease
  reduced-motion-transform: none
borders:
  subtle: 1px solid #303846
  strong: 1px solid #F2F4F7
  brand: 1px solid #D71920
  brand-left-rail: 4px solid #D71920
  hero-left-rail: 7px solid #D71920
components:
  app-background:
    backgroundColor: "{colors.background}"
    textColor: "{colors.on-background}"
  glass-panel:
    backgroundColor: "{colors.surface}"
    textColor: "{colors.on-surface}"
    rounded: "{rounded.panel}"
    padding: "{spacing.panel-padding}"
  command-monitor:
    backgroundColor: "{colors.surface-container-lowest}"
    textColor: "{colors.on-surface}"
    typography: "{typography.data-md}"
    rounded: "{rounded.panel}"
    padding: "{spacing.md}"
  hero-panel:
    backgroundColor: "{colors.surface}"
    textColor: "{colors.on-surface}"
    typography: "{typography.headline-lg}"
    rounded: "{rounded.panel}"
    padding: "{spacing.hero-padding}"
  button-primary:
    backgroundColor: "{colors.primary}"
    textColor: "{colors.on-primary}"
    typography: "{typography.label-md}"
    rounded: "{rounded.control}"
    height: 44px
    padding: 0 14px
  button-primary-hover:
    backgroundColor: "{colors.primary-container}"
    textColor: "{colors.on-primary-container}"
  button-secondary:
    backgroundColor: "{colors.surface-container-high}"
    textColor: "{colors.on-surface}"
    typography: "{typography.label-md}"
    rounded: "{rounded.control}"
    height: 40px
    padding: 0 12px
  button-disabled:
    backgroundColor: "{colors.surface-container-low}"
    textColor: "{colors.on-surface-variant}"
    typography: "{typography.label-md}"
    rounded: "{rounded.control}"
    height: 40px
    padding: 0 12px
  bottom-dock:
    backgroundColor: "{colors.surface-container-low}"
    textColor: "{colors.on-surface}"
    typography: "{typography.label-sm}"
    rounded: "{rounded.dock}"
    height: "{spacing.dock-height}"
    padding: "{spacing.dock-padding}"
  nav-tab:
    backgroundColor: "{colors.surface-container}"
    textColor: "{colors.on-surface-variant}"
    typography: "{typography.ticker-sm}"
    rounded: "{rounded.control}"
    size: 34px
  nav-tab-active:
    backgroundColor: "{colors.surface-container-high}"
    textColor: "{colors.on-surface}"
    typography: "{typography.ticker-sm}"
    rounded: "{rounded.control}"
    size: 34px
  status-badge:
    backgroundColor: "{colors.surface-container-lowest}"
    textColor: "{colors.on-surface-variant}"
    typography: "{typography.label-sm}"
    rounded: "{rounded.control}"
    padding: 0 8px
  warning-badge:
    backgroundColor: "{colors.warning-container}"
    textColor: "{colors.on-warning-container}"
    typography: "{typography.label-sm}"
    rounded: "{rounded.control}"
    padding: 0 8px
  danger-badge:
    backgroundColor: "{colors.error-container}"
    textColor: "{colors.on-error-container}"
    typography: "{typography.label-sm}"
    rounded: "{rounded.control}"
    padding: 0 8px
  success-badge:
    backgroundColor: "{colors.success-container}"
    textColor: "{colors.on-success-container}"
    typography: "{typography.label-sm}"
    rounded: "{rounded.control}"
    padding: 0 8px
  info-badge:
    backgroundColor: "{colors.info-container}"
    textColor: "{colors.on-info-container}"
    typography: "{typography.label-sm}"
    rounded: "{rounded.control}"
    padding: 0 8px
  portrait-frame:
    backgroundColor: "{colors.surface-container-lowest}"
    textColor: "{colors.on-surface}"
    typography: "{typography.display-xl}"
    rounded: "{rounded.control}"
    padding: "{spacing.sm}"
  meter-track:
    backgroundColor: "{colors.surface-container-high}"
    textColor: "{colors.on-surface}"
    rounded: "{rounded.none}"
    height: 8px
  save-card:
    backgroundColor: "{colors.surface-container}"
    textColor: "{colors.on-surface}"
    typography: "{typography.body-sm}"
    rounded: "{rounded.panel}"
    padding: "{spacing.panel-padding}"
  draft-row:
    backgroundColor: "{colors.surface-container-low}"
    textColor: "{colors.on-surface}"
    typography: "{typography.data-md}"
    rounded: "{rounded.control}"
    padding: "{spacing.sm}"
